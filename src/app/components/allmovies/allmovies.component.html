<section class="catalog">
  <p class="catalog__eyebrow">Your catalog</p>
  <h1 class="catalog__title">Everything you can watch</h1>

  @if (movies().length) {
    <div class="catalog__grid">
      @for (movie of movies(); track movie) {
        <app-card [movie]="movie"></app-card>
      }
    </div>
  } @else {
    <p class="catalog__empty">Nothing here yet. New titles land soon.</p>
  }
</section>
