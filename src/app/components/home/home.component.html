<section class="hero">
  <p class="hero__eyebrow">Now showing</p>
  <h1 class="hero__title">Tonight's Double Bill</h1>
  <p class="hero__subtitle">Two picks fresh off the reel, free to preview. Sign in for the full catalog.</p>

  @if (twolastMovies().length) {
    <div class="hero__bill">
      @for (movie of twolastMovies(); track movie) {
        <app-card [movie]="movie" size="featured" [locked]="true"></app-card>
      }
    </div>
  } @else {
    <p class="hero__empty">No reels loaded yet. Check back soon.</p>
  }
</section>
